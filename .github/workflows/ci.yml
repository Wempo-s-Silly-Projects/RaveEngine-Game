name: Rust CI

on:
  pull_request:
  push:
    branches: [main, vertexia-cloudflare-integration]

permissions:
  contents: read

jobs:
  rust:
    name: Format, check, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libvulkan-dev
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run library tests
        run: cargo test --lib
